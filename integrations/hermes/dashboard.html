<style>
  body { margin: 0; padding: 16px; font: 14px/1.45 system-ui, sans-serif; color: var(--rply-fg); }
  h2 { font-size: 13px; font-weight: 600; color: var(--rply-muted); margin: 24px 0 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { background: var(--rply-surface); border-radius: 10px; padding: 10px 14px; min-width: 120px; }
  .stat b { display: block; font-size: 18px; font-weight: 600; }
  .stat span { color: var(--rply-muted); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rply-border); }
  .row:last-child { border-bottom: 0; }
  .main { flex: 1; min-width: 0; }
  .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--rply-muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ok { color: var(--rply-success); } .bad { color: var(--rply-danger); } .warn { color: var(--rply-warning); }
  .actions { display: flex; gap: 6px; flex: none; }
  button { font-size: 12px; padding: 4px 10px; }
  .empty, .error { color: var(--rply-muted); padding: 8px 0; }
  .error { color: var(--rply-danger); }
</style>

<div class="stats" id="stats"></div>
<h2>Scheduled jobs</h2>
<div id="jobs" class="empty">Loading…</div>
<h2>Recent sessions</h2>
<div id="sessions" class="empty">Loading…</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  function when(ms) {
    if (!ms) return "–";
    const d = new Date(ms);
    const sameDay = d.toDateString() === new Date().toDateString();
    return sameDay ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  function lastRun(job) {
    if (job.running) return '<span class="warn">running</span>';
    if (!job.last_run_at) return "never ran";
    return job.ok ? `<span class="ok">✓</span> ${when(job.last_run_at)}` : `<span class="bad">✗ ${when(job.last_run_at)} · ${esc(job.error)}</span>`;
  }

  function renderJobs(jobs) {
    if (!jobs.length) return ($("jobs").innerHTML = '<div class="empty">No scheduled jobs yet. Ask Hermes to schedule one.</div>');
    $("jobs").className = "";
    $("jobs").innerHTML = jobs.map((job) => `
      <div class="row">
        <div class="main">
          <div class="title">${esc(job.name)}</div>
          <div class="meta">${esc(job.schedule)} · last: ${lastRun(job)} · next: ${job.paused ? "paused" : when(job.next_run_at)}</div>
        </div>
        <div class="actions">
          <button data-id="${esc(job.id)}" data-action="run">Run now</button>
          <button data-id="${esc(job.id)}" data-action="${job.paused ? "resume" : "pause"}">${job.paused ? "Resume" : "Pause"}</button>
        </div>
      </div>`).join("");
  }

  function renderSessions(sessions) {
    if (!sessions.length) return ($("sessions").innerHTML = '<div class="empty">No sessions yet.</div>');
    $("sessions").className = "";
    $("sessions").innerHTML = sessions.map((s) => `
      <div class="row">
        <div class="main">
          <div class="title">${esc(s.title || s.preview || "Untitled")}</div>
          <div class="meta">${esc(s.source)} · ${s.messages} messages · ${when(s.last_active)}</div>
        </div>
      </div>`).join("");
  }

  async function load() {
    try {
      const data = await rply.call("hermes-overview");
      $("stats").innerHTML = [
        [data.model || "–", "model"],
        [data.jobs.filter((j) => !j.paused).length + " / " + data.jobs.length, "jobs active"],
        [data.usage.tokens.toLocaleString(), "tokens used"],
        ["$" + data.usage.cost_usd.toFixed(2), "spent"],
      ].map(([value, label]) => `<div class="stat"><b>${esc(value)}</b><span>${label}</span></div>`).join("");
      renderJobs(data.jobs);
      renderSessions(data.sessions);
    } catch (err) {
      const text = err.message === "offline" ? "Hermes isn't connected right now." : "Couldn't load: " + err.message;
      $("jobs").innerHTML = `<div class="error">${esc(text)}</div>`;
    }
  }

  document.addEventListener("click", async (event) => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;
    button.disabled = true;
    try {
      await rply.call("hermes-job", { id: button.dataset.id, action: button.dataset.action });
      await load();
    } catch (err) {
      button.textContent = "Failed";
    }
  });

  load();
  setInterval(() => document.visibilityState === "visible" && load(), 30000);
</script>
